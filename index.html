<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Christ Love International — a Christ-centered mission sharing the Gospel, making disciples, serving communities, and showing practical love.">
  <title>Christ Love International | Christ. Love. Mission.</title>

  <style>
    :root {
      --navy: #071426;
      --navy2: #0d2340;
      --gold: #d9a441;
      --gold2: #f3d28a;
      --white: #ffffff;
      --muted: #b8c5d6;
      --light: #f5f7fa;
      --ink: #172033;
      --shadow: 0 18px 50px rgba(5,17,34,.14);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      color: var(--ink);
      line-height: 1.7;
      background: #fff;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    img {
      max-width: 100%;
      display: block;
    }

    .container {
      width: min(1120px, 92%);
      margin: auto;
    }

    /* NAVIGATION */

    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(7,20,38,.96);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,255,255,.08);
    }

    nav {
      min-height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #fff;
      font-weight: 800;
      letter-spacing: .5px;
    }

    .brand img {
      width: 48px;
      height: 48px;
      object-fit: contain;
    }

    .brand span {
      font-size: 15px;
      line-height: 1.15;
    }

    .brand small {
      display: block;
      color: var(--gold2);
      font-size: 9px;
      letter-spacing: 2px;
      margin-top: 3px;
    }

    .navlinks {
      display: flex;
      gap: 25px;
      align-items: center;
    }

    .navlinks a {
      color: #dce5f1;
      font-size: 14px;
    }

    .navlinks a:hover {
      color: var(--gold2);
    }

    .nav-cta {
      padding: 10px 16px;
      border: 1px solid var(--gold);
      border-radius: 999px;
      color: #fff !important;
    }
